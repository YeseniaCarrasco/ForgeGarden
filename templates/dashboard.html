{% extends "base.html" %}
{% block title %}Dashboard · {{ site_name }}{% endblock %}
{% block content %}
  <h1>Hello, {{ user.name }}</h1>
  <p class="muted">Logged in as <strong>{{ username }}</strong> ({{ role }})</p>
  {% if role == "admin" %}
    <p class="badge">Admin access</p>
  {% endif %}
  <p class="link-row"><a href="{{ url_for('about') }}">About the Forge Garden</a></p>
  <a class="button" href="{{ url_for('logout') }}">Log out</a>
{% endblock %}
