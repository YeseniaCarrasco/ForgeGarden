name: Tests and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Tests empty every table in the test database, so only one run may use it
    # at a time. Runs queue instead of cancelling each other.
    concurrency:
      group: forge-garden-test-database
      cancel-in-progress: false
    env:
      # The only real setting the tests need. Everything else is test-only:
      # tests/conftest.py sets its own SECRET_KEY and ADMIN_USERNAME, points
      # DATABASE_URL at TEST_DATABASE_URL, and removes ANTHROPIC_API_KEY and
      # GCS_BUCKET, so no real keys are used and Claude is never called.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deploy one commit at a time, in order.
    concurrency:
      group: forge-garden-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sign in to Google Cloud
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          umask 077  # the key file is readable only by this user
          printf '%s' "$GCP_CREDENTIALS" > "$RUNNER_TEMP/gcp-credentials.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-credentials.json" --quiet

      - name: Deploy to Cloud Run
        env:
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
        run: |
          if [ -z "$ADMIN_USERNAME" ]; then
            echo "Set the ADMIN_USERNAME repository variable (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi
          gcloud run deploy forge-garden \
            --source . \
            --project my-signup31 \
            --region us-west1 \
            --quiet \
            --update-secrets="SECRET_KEY=FORGE_SECRET_KEY:latest,DATABASE_URL=FORGE_DATABASE_URL:latest,ANTHROPIC_API_KEY=FORGE_ANTHROPIC_API_KEY:latest" \
            --update-env-vars="ADMIN_USERNAME=${ADMIN_USERNAME},SITE_NAME=Forge Garden,TZ=America/Los_Angeles,GCS_BUCKET=forge-garden-photos-my-signup31"

      - name: Sign out and delete the credentials file
        if: always()
        run: |
          gcloud auth revoke --all --quiet || true
          rm -f "$RUNNER_TEMP/gcp-credentials.json"
